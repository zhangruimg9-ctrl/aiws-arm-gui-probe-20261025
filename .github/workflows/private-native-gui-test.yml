name: Private ARM native component GUI test


on:


  workflow_dispatch: {}


permissions:


  contents: read


jobs:


  native-gui:


    runs-on: macos-15


    timeout-minutes: 15


    steps:


      - name: Test exact private native components


        env:


          AIWS_ARM_IMAGE_URL: ${{ secrets.AIWS_ARM_IMAGE_URL }}


          AIWS_ARM_APP_URL: ${{ secrets.AIWS_ARM_APP_URL }}


        shell: bash


        run: |
          set -euo pipefail


          work="$RUNNER_TEMP/aiws-private-native"


          report="$work/report"


          mkdir -p "$report" "$work/input" "$work/app" "$work/mount"


          exec >"$report/native-test.log" 2>&1


          test "$(uname -m)" = arm64


          command -v gpg >/dev/null


          sw_vers > "$report/system-version.txt"


          uname -m > "$report/architecture.txt"


          stat -f '%Su' /dev/console > "$report/console-user.txt"


          mount="$work/mount"


          current_pid=""


          test_phase="input-preflight"
          cleanup() {
            local status=$?
            trap - EXIT
            if test "$status" -ne 0; then
              printf 'PHASE=%s\nEXIT=%s\n' "$test_phase" "$status" > "$report/failure-phase.txt"
              screencapture -x "$report/failure-screen.png" >"$report/failure-capture.txt" 2>&1 || true
              if test -n "$current_pid"; then ps -p "$current_pid" -o pid,ppid,stat,comm >"$report/failure-process.txt" 2>&1 || true; fi
              if test -n "$current_pid" && test -n "${bundle_id:-}" && type gui >/dev/null 2>&1; then gui diagnose "$bundle_id" "$current_pid" >"$report/failure-limited-ax.txt" 2>&1 || true; fi
            fi
            if test -z "$current_pid" || ! kill -0 "$current_pid" 2>/dev/null; then
              hdiutil detach "$mount" >"$report/detach.txt" 2>&1 || true
            else
              printf 'OWNED_APP_STILL_ALIVE; no forced termination or detach\n' > "$report/cleanup-warning.txt"
            fi
            return "$status"
          }
          trap cleanup EXIT
          cat > "$work/gui-driver.applescript" <<'ASDRIVER'
          global axVisited, axPieces, axButtons, axDiagnostic, allDialogDiagnostics, dialogSubject
          on flattenLabel(rawText)
            set oldDelimiters to AppleScript's text item delimiters
            set AppleScript's text item delimiters to {linefeed, return, tab}
            set parts to text items of rawText
            set AppleScript's text item delimiters to " "
            set answer to parts as text
            set AppleScript's text item delimiters to oldDelimiters
            return answer
          end flattenLabel
          on walkAX(theElement, remainingDepth)
            global axVisited, axPieces, axButtons, axDiagnostic
            if remainingDepth < 0 or axVisited >= 400 then return
            set axVisited to axVisited + 1
            tell application "System Events"
              try
                set roleName to role of theElement as text
              on error
                return
              end try
              set labelText to ""
              if roleName is in {"AXStaticText", "AXButton", "AXWindow", "AXDialog", "AXSheet"} then
                try
                  set labelText to name of theElement as text
                  if labelText is "missing value" then set labelText to ""
                  set labelText to my flattenLabel(labelText)
                  if (length of labelText) > 180 then set labelText to text 1 thru 180 of labelText
                end try
              end if
              if labelText is not "" then
                set end of axPieces to labelText
                if (count of axDiagnostic) < 80 then set end of axDiagnostic to roleName & "|" & labelText
              end if
              if roleName is "AXButton" and labelText is not "" then set end of axButtons to {labelText, theElement}
              if remainingDepth > 0 and axVisited < 400 then
                try
                  set childrenList to UI elements of theElement
                  repeat with childRef in childrenList
                    if axVisited >= 400 then exit repeat
                    my walkAX(contents of childRef, remainingDepth - 1)
                  end repeat
                end try
              end if
            end tell
          end walkAX
          on inspectKnownWindow(theWindow, wantedKind, scopeLabel)
            global axVisited, axPieces, axButtons, axDiagnostic, allDialogDiagnostics, dialogSubject
            set axVisited to 0
            set axPieces to {}
            set axButtons to {}
            set axDiagnostic to {}
            my walkAX(theWindow, 16)
            set oldDelimiters to AppleScript's text item delimiters
            set AppleScript's text item delimiters to " "
            set messageText to axPieces as text
            set AppleScript's text item delimiters to linefeed
            set diagnosticText to axDiagnostic as text
            set AppleScript's text item delimiters to oldDelimiters
            if (length of allDialogDiagnostics) < 8192 then
              set allDialogDiagnostics to allDialogDiagnostics & scopeLabel & linefeed & diagnosticText & linefeed
              if (length of allDialogDiagnostics) > 8192 then set allDialogDiagnostics to text 1 thru 8192 of allDialogDiagnostics
            end if
            set chosenButtons to {}
            set chosenName to ""
            set hasKeepRunning to false
            repeat with pairRef in axButtons
              set buttonPair to contents of pairRef
              set buttonLabel to item 1 of buttonPair
              if buttonLabel is "Keep Running" then set hasKeepRunning to true
              if wantedKind is "local-network" and buttonLabel is in {"Don't Allow", "Don’t Allow"} then
                set end of chosenButtons to item 2 of buttonPair
                set chosenName to buttonLabel
              else if wantedKind is "hermes-quit" and buttonLabel is "Quit Anyway" then
                set end of chosenButtons to item 2 of buttonPair
                set chosenName to buttonLabel
              end if
            end repeat
            set messageMatches to false
            if wantedKind is "local-network" then
              set messageMatches to ((messageText contains dialogSubject) and (messageText contains "find devices on local networks"))
            else if wantedKind is "hermes-quit" then
              set messageMatches to ((messageText contains "Hermes is still working on 1 chat") and hasKeepRunning)
            end if
            if messageMatches and (count of chosenButtons) is 1 then
              set chosenButton to item 1 of chosenButtons
              tell application "System Events"
                if not (enabled of chosenButton) then error "EXACT_KNOWN_DIALOG_BUTTON_DISABLED"
                perform action "AXPress" of chosenButton
              end tell
              delay 0.3
              return "CLICKED_EXACT:" & chosenName
            end if
            if messageMatches and (count of chosenButtons) > 1 then error "EXACT_DIALOG_BUTTON_AMBIGUOUS"
            return missing value
          end inspectKnownWindow
          on inspectProcessWindows(targetProcess, wantedKind, scopeLabel)
            tell application "System Events"
              set ownedWindows to windows of targetProcess
              set windowCount to count of ownedWindows
            end tell
            if windowCount > 4 then error "DIALOG_INSPECTION_WINDOW_BOUND_EXCEEDED"
            repeat with windowRef in ownedWindows
              set answer to my inspectKnownWindow(contents of windowRef, wantedKind, scopeLabel)
              if answer is not missing value then return answer
            end repeat
            return missing value
          end inspectProcessWindows
          on handleKnownDialog(ownedProcess, wantedKind)
            global allDialogDiagnostics
            set allDialogDiagnostics to ""
            set answer to my inspectProcessWindows(ownedProcess, wantedKind, "OWNED_PINNED_COMPONENT_PROCESS")
            if answer is not missing value then return answer
            if wantedKind is in {"local-network", "diagnose"} then
              repeat with trustedRef in {"com.apple.UserNotificationCenter", "com.apple.CoreServicesUIAgent", "com.apple.controlcenter"}
                set trustedBundle to contents of trustedRef
                tell application "System Events"
                  set systemMatches to every application process whose bundle identifier is trustedBundle
                end tell
                if (count of systemMatches) > 1 then error "TRUSTED_SYSTEM_PROCESS_AMBIGUOUS"
                if (count of systemMatches) is 1 then
                  set answer to my inspectProcessWindows(item 1 of systemMatches, wantedKind, trustedBundle)
                  if answer is not missing value then return answer
                end if
              end repeat
            end if
            return "NO_EXACT_KNOWN_DIALOG" & linefeed & allDialogDiagnostics
          end handleKnownDialog
          on run argv
            global dialogSubject
            set operation to item 1 of argv
            set wantedBundle to item 2 of argv
            set expectedPID to (item 3 of argv) as integer
            set dialogSubject to ""
            if wantedBundle is "com.nousresearch.hermes-bundled" then set dialogSubject to "Hermes Agent"
            if wantedBundle is "com.deepseek.dsh" then set dialogSubject to "DeepSeek Harness"
            with timeout of 10 seconds
              tell application "System Events"
                if expectedPID > 0 then
                  set matches to every application process whose unix id is expectedPID
                else
                  set matches to every application process whose bundle identifier is wantedBundle
                end if
                if (count of matches) is 0 then
                  if operation is "query" then return "0|0"
                  if operation is in {"deny-local-network", "confirm-hermes-quit", "diagnose"} then return "OWNED_PROCESS_NOT_PRESENT"
                  error "OWNED_PROCESS_MISSING_BEFORE_GUI_ACTION"
                end if
                set ownedProcess to item 1 of matches
                if (bundle identifier of ownedProcess) is not wantedBundle then error "OWNED_PROCESS_IDENTITY_DIFFERS"
                set actualPID to unix id of ownedProcess
                if operation is "query" then
                  tell ownedProcess
                    set windowCount to count of windows
                  end tell
                  return (actualPID as text) & "|" & (windowCount as text)
                else if operation is "activate" then
                  tell ownedProcess to set frontmost to true
                  return "ACTIVATED"
                else if operation is "title" then
                  tell ownedProcess
                    if (count of windows) is 0 then return ""
                    return name of front window
                  end tell
                else if operation is in {"deny-local-network", "confirm-hermes-quit", "diagnose"} then
                  if dialogSubject is "" then return "PINNED_COMPONENT_CONFIRMATION_NOT_APPLICABLE"
                  if operation is "deny-local-network" then return my handleKnownDialog(ownedProcess, "local-network")
                  if operation is "confirm-hermes-quit" then
                    if wantedBundle is not "com.nousresearch.hermes-bundled" then return "HERMES_QUIT_CONFIRMATION_NOT_APPLICABLE"
                    return my handleKnownDialog(ownedProcess, "hermes-quit")
                  end if
                  return my handleKnownDialog(ownedProcess, "diagnose")
                else if operation is "quit" then
                  tell ownedProcess
                    set frontmost to true
                    delay 0.2
                    keystroke "q" using command down
                  end tell
                  return "QUIT_REQUESTED"
                else
                  error "UNKNOWN_GUI_DRIVER_OPERATION"
                end if
              end tell
            end timeout
          end run
          ASDRIVER
          osacompile -o "$work/gui-driver.scpt" "$work/gui-driver.applescript"
          gui() { osascript "$work/gui-driver.scpt" "$1" "$2" "${3:-0}"; }



          if ! curl --fail --location --silent --proto '=https' --tlsv1.2 "$AIWS_ARM_APP_URL" -o "$work/input/app.zip" 2>/dev/null; then


            printf 'PRIVATE_APP_FETCH_FAILED\n'; exit 1


          fi


          unset AIWS_ARM_APP_URL






          printf '%s  %s\n' 'f3790a78052adfce29621ae16ef96dafef870f8a952dfb09d8945bddfff89b57' "$work/input/app.zip" | shasum -a 256 -c -


          ditto -x -k "$work/input/app.zip" "$work/app"


          studio="$(find "$work/app" -name AIWSStudio -type f -print -quit)"


          test -n "$studio"


          test "$(stat -f '%z' "$studio")" = 1643264


          printf '%s  %s\n' 'fdc8fe910b6b58ecbcd2bea6de4f530f3799ad83f35dc88f949fdfcd5680b724' "$studio" | shasum -a 256 -c -


          lipo "$studio" -verify_arch arm64


          printf 'EXACT_CURRENT_STUDIO_BINARY_VERIFIED; not launched and no qualification issued\n' > "$report/studio-scope.txt"
          test_phase="central-gui-driver-preflight"
          printf 'AIWS central GUI driver preflight - no product or credentials\n' > "$work/gui-driver-probe.txt"
          open -a TextEdit "$work/gui-driver-probe.txt"
          windows=0
          for ((attempt=1; attempt<=10; attempt++)); do
            observed="$(gui query com.apple.TextEdit 0)"
            candidate_pid="${observed%%|*}"
            windows="${observed##*|}"
            [[ "$candidate_pid" =~ ^[0-9]+$ && "$windows" =~ ^[0-9]+$ ]]
            if test "$candidate_pid" -gt 0; then current_pid="$candidate_pid"; else current_pid=""; fi
            if test -n "$current_pid" && test "$windows" -gt 0; then break; fi
            sleep 1
          done
          test -n "$current_pid" && test "$windows" -gt 0
          gui activate com.apple.TextEdit "$current_pid"
          gui title com.apple.TextEdit "$current_pid" > "$report/driver-preflight-title.txt"
          grep -Fq 'gui-driver-probe.txt' "$report/driver-preflight-title.txt"
          screencapture -x "$report/driver-preflight-gui.png"
          test -s "$report/driver-preflight-gui.png"
          gui quit com.apple.TextEdit "$current_pid"
          for ((attempt=1; attempt<=30; attempt++)); do
            if ! kill -0 "$current_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$current_pid" 2>/dev/null; then printf 'DRIVER_PREFLIGHT_NORMAL_QUIT_FAILED\n' > "$report/driver-preflight-result.txt"; exit 1; fi
          printf 'SAME_CENTRAL_DRIVER_QUERY_ACTIVATE_TITLE_QUIT=PASS\n' > "$report/driver-preflight-result.txt"
          current_pid=""
          test_phase="latest-public-and-private-image-inputs"



          if ! curl --fail --location --silent --proto '=https' --tlsv1.2 'https://download.deepseek.com/dsh-desk/feeds/mac-arm64/nightly-mac.yml' -o "$report/deepseek-official-feed.yml" 2>/dev/null; then
            printf 'OFFICIAL_DEEPSEEK_FEED_FETCH_FAILED\n'; exit 1
          fi
          python3 - "$report" <<'PYFEED'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1])/'deepseek-official-feed.yml';text=p.read_text()
          expected={'version':'0.2.1-rc.3','url':'https://download.deepseek.com/dsh-desk/bin/mac-arm64/deepseek-harness-0.2.1-rc.3-mac-arm64.zip','sha512':'0tCeP/zLGLtsH+S4BD4TIyRJ8TwRhh7xaJprTMOUoEfj7hYJFC3G5l6nl/2zCTS41MeE9k+KRN19RE9sqX6goQ==','size':'347702586'}
          if p.stat().st_size>65536 or not re.search(r'^version:\s*[\'\"]?'+re.escape(expected['version'])+r'[\'\"]?\s*$',text,re.M) or any(v not in text for v in (expected['url'],expected['sha512'],expected['size'])):raise SystemExit('OFFICIAL_FEED_CHANGED_REQUALIFICATION_REQUIRED')
          PYFEED
          if ! curl --fail --location --silent --proto '=https' --tlsv1.2 'https://download.deepseek.com/dsh-desk/bin/mac-arm64/deepseek-harness-0.2.1-rc.3-mac-arm64.zip' -o "$work/input/deepseek-current.zip" 2>/dev/null; then
            printf 'OFFICIAL_DEEPSEEK_ZIP_FETCH_FAILED\n'; exit 1
          fi
          python3 - "$work/input/deepseek-current.zip" "$report" <<'PYZIP'
          import base64,hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);report=pathlib.Path(sys.argv[2]);expected='0tCeP/zLGLtsH+S4BD4TIyRJ8TwRhh7xaJprTMOUoEfj7hYJFC3G5l6nl/2zCTS41MeE9k+KRN19RE9sqX6goQ=='
          if p.stat().st_size!=347702586:raise SystemExit('OFFICIAL_DEEPSEEK_ZIP_SIZE_DIFFERS')
          h=hashlib.sha512();h256=hashlib.sha256()
          with p.open('rb') as f:
              for block in iter(lambda:f.read(1024*1024),b''):h.update(block);h256.update(block)
          if base64.b64encode(h.digest()).decode()!=expected:raise SystemExit('OFFICIAL_DEEPSEEK_ZIP_SHA512_DIFFERS')
          out={'platform':'mac-arm64','channel':'nightly/preview','version':'0.2.1-rc.3','url':'https://download.deepseek.com/dsh-desk/bin/mac-arm64/deepseek-harness-0.2.1-rc.3-mac-arm64.zip','bytes':p.stat().st_size,'sha512Base64':expected,'sha256':h256.hexdigest(),'freshFeedSha256':hashlib.sha256((report/'deepseek-official-feed.yml').read_bytes()).hexdigest(),'scope':'Separate latest DeepSeek input; immutable existing DMG is reused for Hermes only'}
          (report/'deepseek-official-input.json').write_text(json.dumps(out,indent=2))
          PYZIP
          mkdir -p "$work/deepseek-current"
          ditto -x -k "$work/input/deepseek-current.zip" "$work/deepseek-current"
          if ! curl --fail --location --silent --proto '=https' --tlsv1.2 "$AIWS_ARM_IMAGE_URL" -o "$work/input/arm64.dmg" 2>/dev/null; then


            printf 'PRIVATE_IMAGE_FETCH_FAILED\n'; exit 1


          fi


          unset AIWS_ARM_IMAGE_URL
          test "$(stat -f '%z' "$work/input/arm64.dmg")" = 1958354872
          printf '%s  %s\n' '36b5489eefdb498929632674571c856b12300ad732581497f9d7b5b5133153fd' "$work/input/arm64.dmg" | shasum -a 256 -c -
          hdiutil attach "$work/input/arm64.dmg" -readonly -nobrowse -mountpoint "$mount" > "$report/mount.txt"


          python3 - "$mount" "$report" "$work/deepseek-current" > "$work/components.tsv" <<'PYPLAN'


          import hashlib,json,pathlib,plistlib,re,sys
          root=pathlib.Path(sys.argv[1]).resolve();report=pathlib.Path(sys.argv[2]);current=pathlib.Path(sys.argv[3]).resolve()
          source=json.loads((root/'native-components.json').read_text())
          components=source.get('components') if isinstance(source,dict) else None
          if not isinstance(source,dict) or source.get('schema')!=1 or source.get('architecture')!='arm64' or not isinstance(components,list) or len(components)!=2 or {c.get('id') for c in components if isinstance(c,dict)}!={'hermes','deepseek'}:raise SystemExit('IMAGE_DESCRIPTOR_SCHEMA_REFUSED')
          (report/'immutable-image-descriptor.json').write_text(json.dumps(source,indent=2))
          rows=[]
          for c in components:
              if c['id']=='deepseek':continue
              if c.get('bundle') not in {'Hermes Agent.app','Hermes Agent e06df9c.app'}:raise SystemExit('COMPONENT_BUNDLE_REFUSED')
              app=(root/c['bundle']).resolve()
              if not app.is_relative_to(root) or app.suffix!='.app':raise SystemExit('COMPONENT_PATH_REFUSED')
              info_file=app/'Contents/Info.plist';info=plistlib.loads(info_file.read_bytes());bid=info['CFBundleIdentifier'];exe=info['CFBundleExecutable']
              if not re.fullmatch(r'[A-Za-z0-9_.-]+',bid) or '/' in exe or '\\' in exe or exe in ('.','..'):raise SystemExit('COMPONENT_ID_REFUSED')
              entry=app/'Contents/MacOS'/exe
              if c.get('entry')!='Contents/MacOS/'+exe or c.get('bundleIdentifier')!=bid or c.get('version')!=info['CFBundleShortVersionString']:raise SystemExit('COMPONENT_INFO_DIFFERS_FROM_DESCRIPTOR')
              if info_file.is_symlink() or entry.is_symlink() or hashlib.sha256(info_file.read_bytes()).hexdigest()!=c.get('infoSHA256') or hashlib.sha256(entry.read_bytes()).hexdigest()!=c.get('entrySHA256'):raise SystemExit('COMPONENT_BYTES_DIFFER_FROM_DESCRIPTOR')
              rows.append({'id':'hermes','bundle':str(app),'bundleIdentifier':bid,'entry':str(entry),'version':c['version'],'source':'Exact immutable private DMG'})
          app=(current/'DeepSeek Harness.app').resolve()
          if not app.is_relative_to(current) or not app.is_dir():raise SystemExit('OFFICIAL_DEEPSEEK_LAYOUT_REFUSED')
          info_file=app/'Contents/Info.plist';info=plistlib.loads(info_file.read_bytes());bid=info['CFBundleIdentifier'];exe=info['CFBundleExecutable']
          if bid!='com.deepseek.dsh' or info['CFBundleShortVersionString']!='0.2.1-rc.3' or '/' in exe or '\\' in exe or exe in ('.','..'):raise SystemExit('OFFICIAL_DEEPSEEK_IDENTITY_DIFFERS')
          entry=app/'Contents/MacOS'/exe
          if info_file.is_symlink() or entry.is_symlink() or not entry.is_file():raise SystemExit('OFFICIAL_DEEPSEEK_ENTRY_REFUSED')
          rows.append({'id':'deepseek','bundle':str(app),'bundleIdentifier':bid,'entry':str(entry),'version':info['CFBundleShortVersionString'],'source':'Fresh exact official mac-arm64 rc3 ZIP','infoSHA256':hashlib.sha256(info_file.read_bytes()).hexdigest(),'entrySHA256':hashlib.sha256(entry.read_bytes()).hexdigest()})
          if len(rows)!=2 or len({r['bundleIdentifier'] for r in rows})!=2:raise SystemExit('EXPECTED_TWO_DISTINCT_COMPONENTS')
          rows.sort(key=lambda r: 0 if r['id']=='deepseek' else 1)
          (report/'components.json').write_text(json.dumps(rows,indent=2))
          for r in rows:print('\t'.join([r['id'],r['bundle'],r['bundleIdentifier'],r['entry']]))
          PYPLAN


          while IFS=$'\t' read -r label app bundle_id entry; do
            test_phase="component-$label/identity-and-launch"


            lipo "$entry" -verify_arch arm64


            codesign --verify --deep --strict "$app" >"$report/$label-codesign.txt" 2>&1


            userdata="$work/userdata/$label"


            mkdir -p "$userdata"


            open -n "$app" --args --user-data-dir="$userdata"


            current_pid=""


            windows=0


            for ((attempt=1; attempt<=90; attempt++)); do


              observed="$(gui query "$bundle_id" 0)"


              if test -n "$observed"; then


                candidate_pid="${observed%%|*}"


                windows="${observed##*|}"
                [[ "$candidate_pid" =~ ^[0-9]+$ && "$windows" =~ ^[0-9]+$ ]]
                if test "$candidate_pid" -gt 0; then current_pid="$candidate_pid"; else current_pid=""; fi


                if test "$windows" -gt 0; then break; fi


              fi


              sleep 2


            done


            test -n "$current_pid" && test "$windows" -gt 0


            printf 'PID=%s\nWINDOWS=%s\n' "$current_pid" "$windows" > "$report/$label-window.txt"


            test_phase="component-$label/activate"
            test_phase="component-$label/local-network-confirmation"
            screencapture -x "$report/$label-before-local-network-check.png"
            gui deny-local-network "$bundle_id" "$current_pid" > "$report/$label-local-network-check.txt"
            screencapture -x "$report/$label-after-local-network-check.png"
            gui activate "$bundle_id" "$current_pid"


            sample "$current_pid" 1 1 -file "$report/$label-process-sample.txt" >/dev/null 2>&1


            grep -Eiq '^[[:space:]]*(Code Type|Architecture):[[:space:]]*(ARM-64|ARM64)([[:space:](]|$)' "$report/$label-process-sample.txt"

            if grep -Eiq '^[[:space:]]*Code Type:.*(X86|Translated)' "$report/$label-process-sample.txt"; then exit 1; fi


            gui title "$bundle_id" "$current_pid" > "$report/$label-window-title.txt"


            screencapture -x "$report/$label-gui.png"


            test -s "$report/$label-gui.png"


            test_phase="component-$label/quit"
            gui quit "$bundle_id" "$current_pid"
            if kill -0 "$current_pid" 2>/dev/null; then
              sleep 1
              screencapture -x "$report/$label-before-quit-confirmation.png"
              gui deny-local-network "$bundle_id" "$current_pid" > "$report/$label-post-quit-local-network-check.txt"
              if test "$label" = hermes; then gui confirm-hermes-quit "$bundle_id" "$current_pid" > "$report/hermes-quit-confirmation.txt"; fi
              screencapture -x "$report/$label-after-quit-confirmation.png"
            fi



            for ((attempt=1; attempt<=30; attempt++)); do


              if ! kill -0 "$current_pid" 2>/dev/null; then break; fi


              sleep 1


            done


            if kill -0 "$current_pid" 2>/dev/null; then printf 'NORMAL_QUIT_FAILED\n' > "$report/$label-result.txt"; exit 1; fi


            printf 'EXACT_INPUT=PASS\nARM64_NATIVE_PROCESS=PASS\nREAL_WINDOW=PASS\nSCREENSHOT=CREATED_REQUIRES_REVIEW\nNORMAL_CMD_Q_EXIT=PASS\nEXIT_CODE=UNKNOWN_LAUNCHSERVICES\nMODEL_DIALOGUE=NOT_TESTED\nREAL_USB=NOT_TESTED\n' > "$report/$label-result.txt"


            current_pid=""


          done < "$work/components.tsv"


          python3 - "$report" <<'PYSUMMARY'


          import json,pathlib,sys


          p=pathlib.Path(sys.argv[1]);rows=json.loads((p/'components.json').read_text())


          out={'status':'NATIVE_COMPONENT_GUI_SMOKE_PASS_REQUIRES_IMAGE_REVIEW','components':[r['id'] for r in rows],'arch':'arm64','normalQuitObserved':True,'exitCode':'UNKNOWN_LAUNCHSERVICES','studioBinaryVerifiedOnly':True,'qualificationIssued':False,'modelConversation':'NOT_TESTED','buyerProfileFlow':'NOT_TESTED','realPhysicalUsb':'NOT_TESTED'}


          (p/'summary.json').write_text(json.dumps(out,indent=2))


          PYSUMMARY
      - name: Encrypt bounded private evidence


        id: seal


        if: always()


        env:


          AIWS_ARM_REPORT_KEY: ${{ secrets.AIWS_ARM_REPORT_KEY }}


        shell: bash


        run: |


          set -euo pipefail


          test -n "$AIWS_ARM_REPORT_KEY"


          command -v gpg >/dev/null


          work="$RUNNER_TEMP/aiws-private-native"


          mkdir -p "$work/report"


          total="$(du -sk "$work/report" | awk '{print $1}')"


          test "$total" -le 20480


          tar -C "$work/report" -czf "$work/report.tar.gz" .


          printf '%s' "$AIWS_ARM_REPORT_KEY" | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-fd 0 --output "$work/report.gpg" "$work/report.tar.gz" 2>/dev/null


          test -s "$work/report.gpg"


          printf 'sealed=true\n' >> "$GITHUB_OUTPUT"


      - name: Keep encrypted evidence for local readback


        if: always() && steps.seal.outputs.sealed == 'true'


        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02


        with:


          name: private-arm-native-report-encrypted


          path: ${{ runner.temp }}/aiws-private-native/report.gpg


          retention-days: 1


          if-no-files-found: error


